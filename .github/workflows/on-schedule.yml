name: On Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [factors-verifier, nitro-verifier]
    steps:
      - name: Checkout Bearclave zkVM
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: make audit

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [factors-verifier, nitro-verifier]
    steps:
      - name: Checkout Bearclave zkVM
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Lint ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: make lint
