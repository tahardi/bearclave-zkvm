[advisories]
ignore = [
    # rsa: Marvin attack timing side channel can leak private keys.
    # Ignored because no fixed release exists and we never use RSA private keys.
    "RUSTSEC-2023-0071",
    # paste: unmaintained.
    # Ignored because it is a transitive dependency with no known vulnerability.
    "RUSTSEC-2024-0436",
    # number_prefix: unmaintained.
    # Ignored because it is a transitive dependency with no known vulnerability.
    "RUSTSEC-2025-0119",
    # derivative: unmaintained.
    # Ignored because it is a transitive dependency with no known vulnerability.
    "RUSTSEC-2024-0388",
    # bincode: unmaintained.
    # Ignored because it is a transitive dependency with no known vulnerability.
    "RUSTSEC-2025-0141",
    # atomic-polyfill: unmaintained.
    # Ignored because it is a transitive dependency with no known vulnerability.
    "RUSTSEC-2023-0089",
    # tracing-subscriber 0.2: logged user input can inject ANSI escape sequences into logs.
    # Ignored because the fix is in 0.3, but a transitive dependency pins 0.2.
    "RUSTSEC-2025-0055",
    # ruzstd 0.7: a tiny input can exhaust memory when decompressed.
    # Ignored because it is only built with risc0-zkvm's prove feature, where it reads our own guest binaries,
    # and no risc0-zkvm release, including 5.0.0-rc.1, uses an object crate with the fixed ruzstd yet.
    "RUSTSEC-2026-0344",
    # zip 2.4: extract() can follow symlinks and keep SUID/SGID bits when writing files to disk.
    # Ignored because risc0-circuit-recursion only reads its own embedded archive in memory and never calls extract(),
    # and no risc0 release, including 5.0.0-rc.1, allows zip 9.0.0 or newer yet.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
severity_threshold = "low"

[output]
quiet = true
show_tree = false
