[package]
categories = ["cryptography"]
description = "Parses and validates AWS Nitro Enclave attestation documents"
edition = "2024"
keywords = ["nitro", "attestation", "zkvm"]
license = "UNLICENSED"
name = "nitro-attestation"
readme = "../README.md"
repository = "https://github.com/tahardi/bearclave-zkvm"
version = "0.1.0"

[dependencies]
ciborium = "0.2.2"
const-oid = { version = "0.9", features = ["db"] }
coset = "0.4.2"
p384 = { version = "0.13.1", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10.9"
thiserror = "2"
x509-cert = "0.2.5"

[dev-dependencies]
base64 = "0.22.1"
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
